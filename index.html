<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Typing Challenge</title>
    <style>
        :root {
            --background-color: #1a1a1a;
            --text-color: #e0e0e0;
            --subtle-text-color: #666;
            --primary-color: #f92672;
            --correct-color: #a6e22e;
            --error-color: #ff5555;
            --cursor-color: #ff79c6;
            --container-bg: #222;
            --font-family: 'Fira Code', 'Courier New', Courier, monospace;
            --line-height: 2.2;
        }

        [data-theme='dracula'] {
            --background-color: #282a36;
            --text-color: #f8f8f2;
            --subtle-text-color: #6272a4;
            --primary-color: #ff79c6;
            --correct-color: #50fa7b;
            --error-color: #ff5555;
            --cursor-color: #f8f8f2;
            --container-bg: #22212c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        #watermark {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
            user-select: none;
            z-index: 100;
        }

        #watermark a { color: var(--subtle-text-color); text-decoration: none; }
        #watermark:hover a { color: var(--text-color); }
        #watermark:hover { opacity: 1; }

        .container { width: 90%; max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: 2rem; }

        .settings { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem 2rem; color: var(--subtle-text-color); }

        .setting-group { display: flex; align-items: center; gap: 0.5rem; }

        .setting-group button {
            background: none; border: none; color: var(--subtle-text-color);
            font-family: inherit; cursor: pointer; font-size: 1rem;
            padding: 0.2rem 0.5rem; border-radius: 4px; transition: color 0.2s;
        }

        .setting-group button.active { color: var(--primary-color); font-weight: bold; }
        .setting-group button:not(.active):hover { color: var(--text-color); }

        #theme-selector {
            background: var(--container-bg); color: var(--text-color);
            border: 1px solid var(--subtle-text-color); border-radius: 4px;
            padding: 0.3rem; font-family: inherit;
        }

        #custom-text-container { width: 100%; display: none; }

        #custom-text-input {
            width: 100%; height: 100px; background: var(--container-bg); color: var(--text-color);
            border: 1px solid var(--subtle-text-color); border-radius: 5px; padding: 0.75rem;
            font-family: inherit; font-size: 1rem; resize: vertical;
        }

        #typing-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2rem; }

        .stats { display: flex; justify-content: space-around; width: 100%; max-width: 600px; font-size: 1.5rem; }

        .words-container {
            font-size: 1.75rem; letter-spacing: 1px; line-height: var(--line-height);
            user-select: none; position: relative; max-height: calc(1.75rem * var(--line-height) * 3);
            overflow: hidden; transition: filter 0.3s ease;
        }

        .words-container.unfocused { filter: blur(4px); }

        .words-container.unfocused::after {
            content: 'Click / tap to focus';
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 1.2rem; color: var(--text-color); background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem; border-radius: 5px; z-index: 10;
        }

        #word-wrapper { transition: transform 0.3s ease-out; }

        #word-wrapper span { color: var(--subtle-text-color); }
        #word-wrapper span.correct { color: var(--correct-color); }
        #word-wrapper span.incorrect { color: var(--error-color); text-decoration: underline; }

        #cursor {
            position: absolute; width: 3px; height: 2.5rem;
            background: var(--cursor-color); animation: blink 1s infinite;
            transition: left 0.1s ease, top 0.1s ease; border-radius: 2px;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #typing-input { position: absolute; left: -9999px; opacity: 0; }

        .results {
            display: none; flex-direction: column; align-items: center; gap: 2.5rem;
            width: 100%; max-width: 700px; padding: 2rem;
        }

        .proposal-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--correct-color);
            line-height: 1.3;
            text-align: center;
            max-width: 90%;
        }

        .yes-buttons {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .yes-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.6rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 160px;
        }

        .yes-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 121, 198, 0.6);
        }

        .yes-bold {
            font-weight: 900;
        }

        @media (max-width: 768px) {
            .proposal-text { font-size: 2.8rem; }
            .yes-btn { font-size: 1.4rem; padding: 0.9rem 2rem; }
            .yes-buttons { flex-direction: column; gap: 1.5rem; }
        }
    </style>
</head>
<body data-theme="dracula">

    <div class="container">
        <div class="settings">
            <div class="setting-group" id="time-settings">
                <span>Time:</span>
                <button data-time="15">15s</button>
                <button data-time="30">30s</button>
                <button data-time="60" class="active">60s</button>
                <button data-time="120">120s</button>
            </div>
            <div class="setting-group" id="mode-settings">
                <span>Mode:</span>
                <button data-mode="words" class="active">Words</button>
                <button data-mode="custom">Custom</button>
            </div>
            <div class="setting-group">
                <span>Theme:</span>
                <select id="theme-selector">
                    <option value="dark">Dark</option>
                    <option value="dracula" selected>Dracula</option>
                    <option value="aether">Aether</option>
                </select>
            </div>
        </div>

        <div id="custom-text-container">
            <textarea id="custom-text-input" placeholder="Paste your own text here... (test starts when you type)"></textarea>
        </div>

        <div id="typing-area">
            <div class="stats">
                <div id="timer">60</div>
                <div id="wpm">WPM: 0</div>
            </div>
            <div id="words-container" class="words-container unfocused">
                <div id="word-wrapper"></div>
                <div id="cursor"></div>
            </div>
        </div>

        <input type="text" id="typing-input" autofocus>

        <div id="results" class="results">
            <div class="proposal-text">
                Will you be my Valentine and... <br> my Girlfriend? :)
            </div>
            <div class="yes-buttons">
                <button class="yes-btn" id="yes-normal">Yes</button>
                <button class="yes-btn yes-bold" id="yes-bold">Yes</button>
            </div>
        </div>
    </div>

    <div id="watermark">
        <a href="#">Made with ❤️ by Timothy</a>
    </div>

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const COMMON_WORDS = ['the','be','to','of','and','a','in','that','have','I','it','for','not','on','with','he','as','you','do','at','this','but','his','by','from','they','we','say','her','she','or','an','will','my','one','all','would','there','their','what','so','up','out','if','about','who','get','which','go','me','when','make','can','like','time','no','just','him','know','take','people','into','year','your','good','some','could','them','see','other','than','then','now','look','only','come','its','over','think','also','back','after','use','two','how','our','work','first','well','way','even','new','want','because','any','these','give','day','most','us'];

        // Updated: tight, sweet & personal group
        const ROMANTIC_PHASE1 = [
            'sweet','caring','hug','kiss','cuddle','cute','polaroid',
            'Salt','Lake','City','San','Francisco','Finbar',
            'snowboarding','skiing','koala'
        ];

        // Phase 2 now uses the same tight list (no need for two phases anymore)
        const ROMANTIC_PHASE2 = ROMANTIC_PHASE1;

        const PROPOSAL = "Will you be my Valentine?";
        const SECRET_ANSWER = "girlfriend";

        const WORD_LENGTH = 5;

        const els = {
            typingArea: document.getElementById('typing-area'),
            wordsContainer: document.getElementById('words-container'),
            wordWrapper: document.getElementById('word-wrapper'),
            typingInput: document.getElementById('typing-input'),
            timerEl: document.getElementById('timer'),
            wpmEl: document.getElementById('wpm'),
            resultsEl: document.getElementById('results'),
            cursor: document.getElementById('cursor'),
            timeSettings: document.getElementById('time-settings'),
            modeSettings: document.getElementById('mode-settings'),
            themeSelector: document.getElementById('theme-selector'),
            customTextContainer: document.getElementById('custom-text-container'),
            customTextInput: document.getElementById('custom-text-input'),
        };

        let state = {
            timeLimit: 60,
            timeLeft: 60,
            testMode: 'words',
            charIndex: 0,
            correctChars: 0,
            incorrectChars: 0,
            isTestActive: false,
            timerInterval: null,
            currentText: '',
            currentLine: 0,
            testFinished: false,
        };

        function init() {
            loadTheme();
            setupListeners();
            startGame();
        }

        function setupListeners() {
            document.addEventListener('keydown', () => els.typingInput.focus());
            els.wordsContainer.addEventListener('click', () => els.typingInput.focus());
            els.typingInput.addEventListener('input', handleInput);
            els.typingInput.addEventListener('keydown', handleKeyDown);
            els.typingInput.addEventListener('focus', () => els.wordsContainer.classList.remove('unfocused'));
            els.typingInput.addEventListener('blur', () => els.wordsContainer.classList.add('unfocused'));

            els.timeSettings.addEventListener('click', e => {
                if (e.target.tagName === 'BUTTON') {
                    state.timeLimit = +e.target.dataset.time;
                    els.timeSettings.querySelector('.active')?.classList.remove('active');
                    e.target.classList.add('active');
                    startGame();
                }
            });

            els.modeSettings.addEventListener('click', e => {
                if (e.target.tagName === 'BUTTON') {
                    state.testMode = e.target.dataset.mode;
                    els.modeSettings.querySelector('.active')?.classList.remove('active');
                    e.target.classList.add('active');
                    els.customTextContainer.style.display = state.testMode === 'custom' ? 'block' : 'none';
                    startGame();
                }
            });

            els.themeSelector.addEventListener('change', e => setTheme(e.target.value));
        }

        function startGame() {
            clearInterval(state.timerInterval);
            state = {
                ...state,
                timeLeft: state.timeLimit,
                charIndex: 0,
                correctChars: 0,
                incorrectChars: 0,
                isTestActive: false,
                testFinished: false,
                currentLine: 0,
            };

            els.timerEl.textContent = state.timeLeft;
            els.wpmEl.textContent = 'WPM: 0';
            els.resultsEl.style.display = 'none';
            els.typingArea.style.display = 'flex';
            els.typingInput.value = '';
            els.wordWrapper.style.transform = 'translateY(0px)';

            generateText();
            renderText();
            updateCursor();
            els.typingInput.focus();
        }

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function generateText() {
            if (state.testMode === 'custom') {
                state.currentText = els.customTextInput.value.trim().replace(/\s+/g, ' ') || 'type something here to start';
                return;
            }

            let words = shuffle(COMMON_WORDS).slice(0, 35);
            words = words.concat(shuffle(ROMANTIC_PHASE1).slice(0, 70)); // more instances so the personal words appear often
            words.push(...PROPOSAL.split(' '));

            state.currentText = words.join(' ');
        }

        function renderText() {
            els.wordWrapper.innerHTML = '';
            state.currentText.split('').forEach(c => {
                const span = document.createElement('span');
                span.textContent = c;
                els.wordWrapper.appendChild(span);
            });
        }

        function handleInput() {
            if (state.testFinished) return;
            if (!state.isTestActive) startTimer();

            const value = els.typingInput.value;
            const spans = els.wordWrapper.querySelectorAll('span');

            if (value.length <= state.charIndex) return;

            const typedChar = value.slice(-1);
            const span = spans[state.charIndex];

            if (!span) return;

            const expected = span.textContent;

            const valentineStart = state.currentText.lastIndexOf('Valentine?');
            const inValentineZone = state.charIndex >= valentineStart && state.charIndex < valentineStart + 'Valentine?'.length;

            let correct = typedChar === expected;

            if (inValentineZone) {
                const typedTail = value.slice(valentineStart).toLowerCase();
                const target = SECRET_ANSWER.toLowerCase();
                correct = typedTail.startsWith(target.slice(0, typedTail.length));
            }

            span.classList.remove('correct', 'incorrect');
            if (correct) {
                span.classList.add('correct');
                state.correctChars++;
            } else {
                span.classList.add('incorrect');
                state.incorrectChars++;
            }

            state.charIndex++;
            updateCursor();
            updateWPM();

            if (state.charIndex >= spans.length) {
                const typedEnd = value.slice(valentineStart).toLowerCase().trim();
                if (typedEnd.startsWith(SECRET_ANSWER.toLowerCase())) {
                    endGame();
                }
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Backspace' && state.charIndex > 0 && !state.testFinished) {
                e.preventDefault();

                state.charIndex--;

                const span = els.wordWrapper.querySelectorAll('span')[state.charIndex];
                if (span) {
                    if (span.classList.contains('correct')) state.correctChars--;
                    if (span.classList.contains('incorrect')) state.incorrectChars--;
                    span.classList.remove('correct', 'incorrect');
                }

                els.typingInput.value = els.typingInput.value.slice(0, state.charIndex);

                updateCursor();
                updateWPM();
            }
        }

        function startTimer() {
            state.isTestActive = true;
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                els.timerEl.textContent = Math.max(0, state.timeLeft);
                updateWPM();
            }, 1000);
        }

        function updateWPM() {
            if (!state.isTestActive) return;
            const elapsed = (state.timeLimit - state.timeLeft) / 60;
            if (elapsed > 0) {
                const wpm = Math.round((state.correctChars / WORD_LENGTH) / elapsed);
                els.wpmEl.textContent = `WPM: ${wpm}`;
            }
        }

        function updateCursor() {
            const spans = els.wordWrapper.querySelectorAll('span');
            if (state.charIndex >= spans.length) return;

            const span = spans[state.charIndex];
            els.cursor.style.top  = span.offsetTop  + 'px';
            els.cursor.style.left = span.offsetLeft + 'px';

            const fs = parseFloat(getComputedStyle(els.wordsContainer).fontSize);
            const lineHeightPx = fs * 2.2;

            const currentLine = Math.floor(span.offsetTop / lineHeightPx);

            const linesVisible = 3.5;
            const triggerLine = state.currentLine + linesVisible - 1;

            if (currentLine >= triggerLine) {
                state.currentLine = currentLine - (linesVisible - 2);
                const scrollPx = - state.currentLine * lineHeightPx;
                els.wordWrapper.style.transform = `translateY(${scrollPx}px)`;
            }
        }

        function endGame() {
            clearInterval(state.timerInterval);
            state.isTestActive = false;
            state.testFinished = true;
            els.typingInput.blur();
            els.typingArea.style.display = 'none';
            els.resultsEl.style.display = 'flex';
        }

        // Confetti on Yes click
        function fireConfetti() {
            const duration = 5000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);

                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));

                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        document.getElementById('yes-normal')?.addEventListener('click', fireConfetti);
        document.getElementById('yes-bold')?.addEventListener('click', fireConfetti);

        function setTheme(theme) {
            document.body.dataset.theme = theme;
            localStorage.setItem('typingTheme', theme);
        }

        function loadTheme() {
            const saved = localStorage.getItem('typingTheme') || 'dracula';
            els.themeSelector.value = saved;
            setTheme(saved);
        }

        init();
    });
    </script>
</body>
</html>
